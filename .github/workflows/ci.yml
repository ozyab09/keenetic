name: CI

# Запускается при push в любую ветку и при создании pull request (MR)
on:
  push:
  pull_request:

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Проверка синтаксиса
        run: python -m compileall -q keenetic tests

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v
