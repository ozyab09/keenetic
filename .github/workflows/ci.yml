name: CI

# Runs on any push and on pull request creation
on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Syntax check
        run: python -m compileall -q keenetic tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v
